server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;

    index index.html;
    autoindex off;

    absolute_redirect off;
    port_in_redirect off;

    # ---- CRITICAL FIX ----
    # Prevent Nginx from auto-adding trailing slash
    location = /auth {
        try_files /auth.html /index.html =404;
    }

    location = /auth/callback {
        try_files /auth/callback.html /index.html =404;
    }

    # ---- General SPA fallback ----
    location / {
        try_files $uri $uri.html /index.html;
    }
}
